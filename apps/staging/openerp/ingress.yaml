# The demo lives at demo.goeasyerp.org. Cloudflare terminates TLS at its edge and the
# tunnel talks plain HTTP to traefik, so there is no tls: block and no cert-manager here
# (same as the goeasyerp.org landing page). The frontend's ORIGIN env var must equal this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openerp
  namespace: openerp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: demo.goeasyerp.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openerp-frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: openerp-backend
                port:
                  number: 8080
---
# Old name: redirect (temporary, 302) to the new one, keeping path and query.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-demo
  namespace: openerp
spec:
  redirectRegex:
    regex: '^https?://openerp\.hansjlachmann\.net/?(.*)'
    replacement: 'https://demo.goeasyerp.org/${1}'
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openerp-legacy
  namespace: openerp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.middlewares: openerp-redirect-to-demo@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - openerp.hansjlachmann.net
      secretName: openerp-tls
  rules:
    - host: openerp.hansjlachmann.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openerp-frontend
                port:
                  number: 3000
