# No tls: block and no cert-manager annotation on purpose: Cloudflare terminates
# TLS at its edge and the tunnel talks plain HTTP to traefik (same as verifactucloud.com).
#
# goeasyerp.org is the only site served here. The old goeasyerp.com is redirected to it
# by a Cloudflare Redirect Rule (zone goeasyerp.com), not by the cluster.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goeasyerp-web
  namespace: goeasyerp-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: goeasyerp.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goeasyerp-web
                port:
                  number: 80
    - host: www.goeasyerp.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goeasyerp-web
                port:
                  number: 80
