apiVersion: apps/v1
kind: Deployment
metadata:
  name: goeasyerp-web
  namespace: goeasyerp-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goeasyerp-web
  template:
    metadata:
      labels:
        app: goeasyerp-web
    spec:
      containers:
        - name: web
          # Public GHCR package, multi-arch. Pinned to a release tag; Renovate opens
          # (and auto-merges) the bump PR for each new v* tag of the goeasyerp.com repo.
          image: ghcr.io/hansjlachmann/goeasyerp.com:1.0.11
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
