# App builder: compiles the GoEasyERP server together with installed extension apps into a
# volume shared with the backend; the backend switches to the result by itself.
# Keep this image tag EQUAL to the backend's: a builder of another version refuses requests.
# Renovate updates backend, frontend and builder together (see renovate.json).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openerp-app-builds-pvc
  namespace: openerp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openerp-builder
  namespace: openerp
spec:
  replicas: 1
  # one builder at a time on the volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openerp-builder
  template:
    metadata:
      labels:
        app: openerp-builder
    spec:
      containers:
        - name: builder
          # keep this tag equal to the backend's
          image: ghcr.io/hansjlachmann/goeasyerp/builder:0.1.168
          env:
            - name: DB_HOST
              value: "openerp-postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "openerp"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openerp-secret
                  key: db-password
            - name: DB_NAME
              value: "openerp"
            - name: APP_BUILDS_DIR
              value: "/builds"
            # Keep the Go build's peak memory under the 6Gi limit: collect garbage
            # more often, build 2 packages at a time, and compile the (huge)
            # generated tables package single-threaded.
            - name: GOGC
              value: "25"
            - name: GOFLAGS
              value: "-p=2 -gcflags=github.com/hansjlachmann/goeasyerp/backend/generated/tables=-c=1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # a Go build peaks well above 2.5 GB on the Pi (OOM-killed at 2560Mi);
              # idle it uses almost nothing
              memory: "6Gi"
          volumeMounts:
            - name: app-builds
              mountPath: /builds
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: app-builds
          persistentVolumeClaim:
            claimName: openerp-app-builds-pvc
