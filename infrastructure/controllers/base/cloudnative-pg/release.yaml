apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      # 🔴 HELD. DO NOT BUMP WITHOUT MIGRATING BACKUPS FIRST.
      #
      # This chart carries CNPG operator 1.30, where `barmanObjectStore` is
      # DEPRECATED — and it is REMOVED in 1.31. Both `verifactu` and
      # `verifactucloud-facturas` back up through it.
      #
      # The failure mode is silent: the Cluster keeps running, nothing crashes,
      # Flux reports green, and WAL simply stops being archived.
      #
      # Migrate both databases to the Barman Cloud Plugin BEFORE raising this.
      # (0.29.0 is the latest chart today; the next release may cross into 1.31.)
      # Renovate is also configured NOT to bump this chart — see renovate.json.
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
  install:
    remediation:
      retries: 3
  values:
    # The chart ships the postgresql.cnpg.io CRDs as templates gated by this
    # value. They MUST install, or the verifactu `Cluster` CR has no kind to
    # match and its Kustomization fails with `no matches for kind "Cluster"`.
    crds:
      create: true
