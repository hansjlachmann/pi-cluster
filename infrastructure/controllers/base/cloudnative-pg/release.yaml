apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"   # operator ~v1.29/1.30 — Use latest stable (Renovate tracks it)
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
  install:
    remediation:
      retries: 3
  values:
    # The chart ships the postgresql.cnpg.io CRDs as templates gated by this
    # value. They MUST install, or the verifactu `Cluster` CR has no kind to
    # match and its Kustomization fails with `no matches for kind "Cluster"`.
    crds:
      create: true
