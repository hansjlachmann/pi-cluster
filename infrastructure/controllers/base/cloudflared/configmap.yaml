apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 21d3e1bf-81c0-4405-a31c-3593bb2a01ef
    credentials-file: /etc/cloudflared/credentials.json

    loglevel: info

    ingress:
      - hostname: linkding.hansjlachmann.net
        service: http://linkding.linkding.svc.cluster.local:9090

      - hostname: mealie.hansjlachmann.net
        service: http://mealie.mealie.svc.cluster.local:9000

      - hostname: grafana.hansjlachmann.net
        service: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80

      - hostname: seafile.hansjlachmann.net
        service: http://seafile.seafile.svc.cluster.local:80
        # service: http://traefik.kube-system.svc.cluster.local:80

      - hostname: audiobookshelf.hansjlachmann.net
        service: http://audiobookshelf.audiobookshelf.svc.cluster.local:3005

      - hostname: openerp.hansjlachmann.net
        service: http://traefik.kube-system.svc.cluster.local:80
      # - hostname: openerp.hansjlachmann.net
      #   service: http://openerp-frontend.openerp.svc.cluster.local:3000
      
      - hostname: n8n.hansjlachmann.net
        service: http://traefik.kube-system.svc.cluster.local:80

      - hostname: verifactucloud.com
        service: http://traefik.kube-system.svc.cluster.local:80

      - hostname: www.verifactucloud.com
        service: http://traefik.kube-system.svc.cluster.local:80

      - hostname: api.verifactucloud.com
        service: http://traefik.kube-system.svc.cluster.local:80

      # Staging for the same API. The bare name above is being freed for a
      # future production deployment; this name's meaning never changes.
      # Both currently reach the SAME verifactu-api backend — see the
      # verifactu repo's deploy/k8s/ingress.yaml header for the four-step plan.
      - hostname: api-staging.verifactucloud.com
        service: http://traefik.kube-system.svc.cluster.local:80

      # The invoicing app, on its qualified staging name. The bare
      # facturas.verifactucloud.com was cut over to this name and removed from
      # the tunnel (Item 78 step 3), freeing the bare name for a future
      # production deployment. Reversible: re-add facturas. here + its DNS to
      # restore it. Publishing a name still needs a proxied CNAME to
      # 21d3e1bf-81c0-4405-a31c-3593bb2a01ef.cfargotunnel.com AND a cloudflared
      # restart — Flux applying this ConfigMap does not reload the running tunnel.
      - hostname: facturas-staging.verifactucloud.com
        service: http://traefik.kube-system.svc.cluster.local:80

      - hostname: ssh.hansjlachmann.net
        service: ssh://localhost:22

    # Default behavior
      - service: http_status:404
