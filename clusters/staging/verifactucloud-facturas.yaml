apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: verifactucloud-facturas
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/k8s
  prune: true

  # ⚠️ wait: false, unlike verifactucloud-web — and for the same reason verifactu
  # needed it (see 15c4e4f). This path contains a CloudNativePG Cluster, which
  # kstatus cannot decide readiness for: a wait:true Kustomization sits until the
  # timeout and then reports failure on a perfectly healthy database. The
  # Deployment health check below is what actually gates success.
  wait: false

  sourceRef:
    kind: GitRepository
    name: verifactucloud-facturas

  # ⚠️ No decryption block, unlike verifactucloud-web. Nothing in that repo's
  # deploy/k8s is SOPS-encrypted, because no Secret is committed there at all —
  # the partner credential and the GHCR pull credential are created directly in
  # the cluster, and that repository's CI fails if a Secret ever appears in the
  # reconciled set.

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: facturas
      namespace: verifactucloud-facturas
